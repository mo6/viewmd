[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "viewmd"
version = "1.51.1"
description = "View Markdown files from the command line, with color, tables, Mermaid diagrams, and its own built-in mouse-driven, scrollable interactive pager."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "George Moses", email = "gmo6nl@gmail.com" }]
dependencies = ["rich>=13", "wcwidth>=0.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pip-audit>=2.7"]

[project.scripts]
viewmd = "viewmd.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["viewmd"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# pytest assert is the test idiom; S101 would be pure noise.
"tests/**" = ["S101"]
# Maintainer tooling: fixed argv lists to known binaries, no shell, no user input as argv0.
"tools/**" = ["S101", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
